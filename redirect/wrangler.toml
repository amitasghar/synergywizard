# Redirect-only Worker for the short domain. Custom domains make Cloudflare create the DNS records itself.
# Deploy: cd redirect && npx wrangler deploy
name = "synergywizard-redirect"
main = "index.js"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [
  { pattern = "synergywizard.com", custom_domain = true },
  { pattern = "www.synergywizard.com", custom_domain = true },
]
