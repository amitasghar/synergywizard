[build]
  command = "npm run build"
  publish = "dist"

# Data files keep fixed names and change after each patch, so always revalidate.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Build assets have content hashes in their names, so they never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The official address is poe2.90sgamer.com; send the old one there, keeping path and query.
[[redirects]]
  from = "https://synergywizard.netlify.app/*"
  to = "https://poe2.90sgamer.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "24"
