name: Update PoE2 data

# Every 3 hours: rebuild public/data from RePoE when it publishes a new PoE2 export.
# When the data changes, the job commits it and uploads the site to Cloudflare Pages with wrangler (needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID). Costs nothing: no AI, no database.
on:
  schedule:
    - cron: '0 */3 * * *'  # every 3 hours; deploys only when the data changes
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the RePoE version is unchanged
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: node_modules/@xenova/transformers/.cache
          key: minilm-l6-v2

      - run: npm ci

      - run: npm test

      - name: Build data
        run: node datagen/cli.ts ${{ inputs.force && '--force' || '' }}

      - name: Commit data
        id: commit
        run: |
          git config user.name "synergy-wizard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet public/data; then
            version=$(node -p "require('./public/data/poe2.json').version")
            git add public/data
            git commit -m "data: PoE2 ${version}"
            git push
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 4320000 ]; then
            # GitHub disables scheduled workflows after 60 days without repo activity.
            git commit --allow-empty -m "chore: keep scheduled data updates alive [skip ci]"
            git push
          else
            echo "No data change"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.deployed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_ADSENSE_CLIENT: ${{ vars.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_SLOT_INLINE: ${{ vars.VITE_ADSENSE_SLOT_INLINE }}
          VITE_ADSENSE_SLOT_BOTTOM: ${{ vars.VITE_ADSENSE_SLOT_BOTTOM }}
        run: |
          sha=$(git rev-parse HEAD)
          CF_PAGES_COMMIT_SHA=$sha npx vite build
          npx wrangler@4 pages deploy dist --project-name synergywizard --branch master --commit-hash $sha --commit-message "data update" --commit-dirty=true
