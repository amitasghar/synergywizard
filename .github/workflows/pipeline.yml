name: Update PoE2 data

# Daily: rebuild public/data from RePoE when it publishes a new PoE2 export.
# A data commit to master triggers the Netlify deploy. Costs nothing: no AI, no database.
on:
  schedule:
    - cron: '0 9 * * *'  # 09:00 UTC daily
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the RePoE version is unchanged
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: node_modules/@xenova/transformers/.cache
          key: minilm-l6-v2

      - run: npm ci

      - run: npm test

      - name: Build data
        run: node datagen/cli.ts ${{ inputs.force && '--force' || '' }}

      - name: Commit data
        run: |
          git config user.name "synergy-wizard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet public/data; then
            version=$(node -p "require('./public/data/poe2.json').version")
            git add public/data
            git commit -m "data: PoE2 ${version}"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 4320000 ]; then
            # GitHub disables scheduled workflows after 60 days without repo activity.
            git commit --allow-empty -m "chore: keep scheduled data updates alive [skip netlify]"
            git push
          else
            echo "No data change"
          fi
